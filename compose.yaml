name: muni-cloud-lab
services:
  portail:
    build: .
    image: muni-cloud/portail:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MUNI_VERSION: "${MUNI_VERSION:-local}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 80
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 20s
      timeout: 3s
      retries: 3
